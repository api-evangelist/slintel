description: >-
  Probe of the /.well-known/ discovery surface for every Slintel-controlled host.
  NOTHING was found: not one path returned a 200 carrying a real document, so no
  WellKnown, SecurityTxt, APICatalog or AgentCard pointer is wired in apis.yml —
  this file records an absence, and an absence must not be published as a presence.
  The two Slintel hosts behave in two different ways, and both are findings in
  their own right. The apex slintel.com answers HTTP 301 to
  https://6sense.com:443/platform/sales for EVERY path requested, including every
  /.well-known/ path — a blanket brand redirect into the acquirer, not a document
  surface. www.slintel.com sits behind a Cloudflare bot challenge that answers
  HTTP 403 (cf-mitigated: challenge) to every automated request on every path,
  including the site root, so no conclusion is drawn about what that host would
  serve to a browser. The historical API hosts api.slintel.com and
  app.slintel.com still carry CNAMEs to AWS ELB names
  (slintel-php-applb-external-1006260449.us-east-2.elb.amazonaws.com and
  slintelprodalb-632670574.us-east-2.elb.amazonaws.com) that themselves no longer
  resolve — dangling records for load balancers that have been torn down — so
  they could not be probed at all.
