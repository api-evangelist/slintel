name: Slintel
description: 'Slintel is a B2B sales and market intelligence platform that mines buyer
  and technographic signals — company firmographics, technology installs, psychographics,
  and buying-intent scores — to help revenue teams prioritize accounts and time outreach.
  Founded in 2016 and backed by Accel and Sequoia, Slintel was acquired by 6sense in
  2021 and its data and API services are now consolidated into the 6sense Revenue AI
  platform. Slintel''s programmatic surface (company identification, firmographics,
  lead scoring, and enrichment) is delivered through the 6sense API Portal rather than
  a standalone Slintel developer portal. As of a 2026-08-14 probe pass, Slintel operates
  no developer surface of its own: slintel.com redirects every path into 6sense.com, the
  historical api.slintel.com and app.slintel.com hosts are decommissioned, no /.well-known/
  document or machine-readable spec is served, and no first-party SDK exists in any public
  package registry. The successor APIs are catalogued under the 6sense provider.'
