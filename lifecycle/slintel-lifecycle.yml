description: >-
  This is an END-OF-LIFE record, not a versioning policy. Slintel published no
  deprecation policy, no versioning scheme and no status page that survives, and
  none can be reconstructed — so nothing here is asserted about how Slintel used
  to manage change. What IS observable, and what this artifact records, is the
  terminal state of the Slintel brand's own surface: the company was acquired by
  6sense in October 2021, the apex domain now answers a blanket HTTP 301 into the
  acquirer's site on every path, and the two hosts that served the product and
  its API have been decommissioned at the load balancer while their DNS records
  were left behind. No StatusPage or Deprecation pointer is wired in apis.yml:
  6sense operates a status page and a versioning policy, but those are 6sense's
  and are recorded on the 6sense provider, not borrowed to credit Slintel.
